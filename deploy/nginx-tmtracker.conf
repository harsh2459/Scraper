# TM Tracker — nginx site config
#
# Two apps, two subdomains, both on the same VPS:
#   MAIN_DOMAIN     -> TM Manager (React frontend + /api/* backend :5005)
#   scraper.<MAIN>  -> Scraper UI (Flask app :5001 — /, /ipindia, /settings,
#                      /discover, /working, /ipindia/history, ...)
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │ !! DO NOT sed/copy THIS FILE straight onto a server that already has │
# │    HTTPS set up !! certbot rewrites /etc/nginx/sites-available/      │
# │    tmtracker in place to add the `listen 443 ssl;` blocks + cert     │
# │    paths + the http->https redirect. This template has none of      │
# │    that — deploying it over a live site DELETES HTTPS and the site  │
# │    goes ERR_CONNECTION_REFUSED on :443 until certbot is re-run.      │
# │                                                                      │
# │ This file is ONLY for: (a) a brand-new server that has never had     │
# │ certbot run (server-setup.sh does this once), or (b) as a reference  │
# │ if you need to see what the *plain-HTTP* location blocks look like   │
# │ before certbot's edits. To change a location block on a LIVE server, │
# │ edit /etc/nginx/sites-available/tmtracker directly on the server     │
# │ (nano), NOT by re-deploying this file — then `nginx -t && systemctl  │
# │ reload nginx`. If you do overwrite it by mistake, recover with:      │
# │   sudo certbot --nginx -d MAIN_DOMAIN -d www.MAIN_DOMAIN \           │
# │     -d scraper.MAIN_DOMAIN --redirect --non-interactive              │
# └──────────────────────────────────────────────────────────────────────┘
#
# server-setup.sh substitutes MAIN_DOMAIN with your SERVER_NAME.
# Then `certbot --nginx -d <MAIN> -d www.<MAIN> -d scraper.<MAIN>` adds HTTPS
# to every server block and sets up the HTTP->HTTPS redirect.

# ============================================================ TM MANAGER (main)
server {
    listen 80;
    listen [::]:80;
    server_name MAIN_DOMAIN www.MAIN_DOMAIN;

    client_max_body_size 200M;

    root /opt/tmtracker/tm_manager/frontend/dist;
    index index.html;

    # Backend API + login page -> 127.0.0.1:5005
    location = /login {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Backend file routes (only real sub-paths — a hard refresh of the
    # client-side /trademark/:id route falls through to index.html).
    location ~ ^/trademark/\d+/(logo|document|notice|retry|remove) {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /journal-entry/ { proxy_pass http://127.0.0.1:5005; proxy_set_header Host $host; }
    location = /retry-all-errors { proxy_pass http://127.0.0.1:5005; proxy_set_header Host $host; }

    # Live TM Search calls the scraper via  /scraper-api/*  -> strip -> :5001
    location /scraper-api/ {
        rewrite ^/scraper-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ====================================================== SCRAPER UI (subdomain)
server {
    listen 80;
    listen [::]:80;
    server_name scraper.MAIN_DOMAIN;

    client_max_body_size 200M;

    # Whole app proxied at root (its Jinja templates use absolute paths like
    # /ipindia, /settings — so it must be served from / , not a sub-path).
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # long scrapes / OTP waits
    }
}
