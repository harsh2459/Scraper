# Include INSIDE the existing HTTPS server block. Preserve its certificate
# directives. Replace the old /api/ location with the one below.
# Do not proxy /login: that is a React page; /api/login reaches the user API.
location = /admin { return 302 /admin/; }
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:5010;
    proxy_set_header Host $host;
}
location ^~ /api/control/v1/admin/ {
    proxy_pass http://127.0.0.1:5005;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/control/ {
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:5010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
location /api/ {
    proxy_pass http://127.0.0.1:5005;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
# Existing /trademark/<id>/document|notice|logo locations remain pointed at
# :5005; they enforce user ownership and read the shared fleet artifact store.
