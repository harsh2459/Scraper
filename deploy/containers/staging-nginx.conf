# Staging only: accessible through an SSH tunnel, never a public listener.
server {
    listen 127.0.0.1:5585;
    server_name localhost;
    root /var/www/tmtracker-staging;
    client_max_body_size 32m;
    location = /admin { return 302 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:5510;
        proxy_set_header Host $http_host;
    }
    location ^~ /api/control/v1/admin/ {
        proxy_pass http://127.0.0.1:5505;
        proxy_set_header Host $http_host;
    }
    location ^~ /api/control/ {
        proxy_pass http://127.0.0.1:5510;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5505;
        proxy_set_header Host $http_host;
    }
    location ~ ^/trademark/[0-9]+/(logo|document|notice|retry|remove) {
        proxy_pass http://127.0.0.1:5505;
        proxy_set_header Host $http_host;
    }
    location /journal-entry/ {
        proxy_pass http://127.0.0.1:5505;
        proxy_set_header Host $http_host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
