name: tmtracker-live
x-runtime: &runtime
  image: tmtracker-live:${RELEASE_TAG:?Production release tag required}
  build: {context: ../.., dockerfile: deploy/containers/Dockerfile}
  entrypoint: [python, /usr/local/bin/tmtracker-production.py]
  network_mode: host
  user: "${TMTRACKER_UID:?UID required}:${TMTRACKER_GID:?GID required}"
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  control:
    <<: *runtime
    env_file: [{path: /etc/tmtracker/live-control.env, format: raw}]
    command: [control]
    volumes:
      - type: bind
        source: /var/lib/tmtracker/live/fleet-artifacts
        target: /var/lib/tmtracker/live/fleet-artifacts
        bind: {create_host_path: false}
  user:
    <<: *runtime
    env_file: [{path: /etc/tmtracker/live-user.env, format: raw}]
    command: [user]
    volumes:
      - type: bind
        source: /opt/tmtracker/data
        target: /opt/tmtracker/data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/tmtracker/tm_manager/Journal
        target: /opt/tmtracker/tm_manager/Journal
        bind: {create_host_path: false}
      - type: bind
        source: /var/lib/tmtracker/live/fleet-artifacts
        target: /var/lib/tmtracker/live/fleet-artifacts
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/tmtracker/tm_manager/_logo_cache
        target: /opt/tmtracker/tm_manager/_logo_cache
        bind: {create_host_path: false}
      - type: bind
        source: /opt/tmtracker/tm_manager/_journal_logo_cache
        target: /opt/tmtracker/tm_manager/_journal_logo_cache
        bind: {create_host_path: false}
