<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TM Tracker icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2C57"/>
      <stop offset="1" stop-color="#111C3B"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- Countdown track -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="30"/>

  <!-- Amber progress arc (near-complete countdown, gap at top-left) -->
  <path d="M 256 106 A 150 150 0 1 1 150 150" fill="none" stroke="#F6A21E" stroke-width="30" stroke-linecap="round"/>

  <!-- Leading blip / locator -->
  <circle cx="150" cy="150" r="30" fill="#F6A21E"/>
  <circle cx="150" cy="150" r="11" fill="#152449"/>

  <!-- Confirmation check -->
  <path d="M198 260 L240 302 L322 206" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
