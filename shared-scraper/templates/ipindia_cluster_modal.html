{% import "_icons.html" as icons %}
{% if error %}
<div class="banner error" style="margin-bottom:12px">{{ error }}</div>
{% endif %}

{% if pending_id %}
<p style="color:var(--muted);font-size:0.88rem;margin-top:0">
  OTP was sent to <strong>{{ email }}</strong>. Enter it below to start the run.
</p>
<form method="post" action="{{ url_for('cluster_verify_otp') }}" class="cluster-otp-form" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
  <input type="hidden" name="pending_id" value="{{ pending_id }}">
  <input type="hidden" name="back" value="{{ back_url or '' }}">
  <div class="field-g">
    <label class="field-label" for="cluster-otp">6-digit OTP</label>
    <input type="number" id="cluster-otp" name="otp_code" min="100000" max="999999" required autofocus
           placeholder="123456" style="max-width:160px;font-size:1.2rem;font-weight:700;letter-spacing:2px;text-align:center">
  </div>
  <button type="submit">{{ icons.play(14) }} Verify &amp; Start</button>
</form>
{% else %}
<form method="post" action="{{ url_for('cluster_start') }}" class="cluster-start-form auth-mode-form" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
  <input type="hidden" name="back" value="{{ back_url or '' }}">
  <input type="hidden" name="auth_mode" class="auth-mode-input" value="{{ 'pool' if pool_free_count else 'manual' }}">
  <div class="field-g">
    <label class="field-label">Login</label>
    <div class="auth-mode-toggle">
      <button type="button" class="auth-tab {{ 'active' if pool_free_count }}" onclick="setAuthMode(this, 'pool')">
        {{ icons.bolt(12) }} Auto (pool) — {{ pool_free_count }} free
      </button>
      <button type="button" class="auth-tab {{ 'active' if not pool_free_count }}" onclick="setAuthMode(this, 'manual')">Manual entry</button>
    </div>
  </div>
  <div class="field-g auth-manual-email" style="display:{{ 'none' if pool_free_count else 'flex' }}">
    <label class="field-label" for="cluster-email">Your Email Address</label>
    <input type="email" id="cluster-email" name="email" {{ 'required' if not pool_free_count }} placeholder="you@gmail.com" autocomplete="username">
  </div>
  <div class="field-g">
    <label class="field-label" for="cluster-mark-name">Seed trade mark name</label>
    <input type="text" id="cluster-mark-name" name="mark_name" required value="{{ mark_name or '' }}">
  </div>
  <button type="submit">{{ icons.search(14) }} Send OTP &amp; Continue</button>
</form>
{% endif %}
